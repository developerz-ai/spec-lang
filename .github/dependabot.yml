version: 2
# Monthly and grouped: this is a pre-release repo, and a weekly PR per patch release is noise.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
