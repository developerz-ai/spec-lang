# The spec-lang toolchain gate. It runs src/bin/check and nothing else, so green locally is green here.
name: compiler

on:
  pull_request:
    paths: ["src/**", "libs/**", "docs/**", "pocs/todo-app/src/**", "README.md", ".github/workflows/compiler.yml"]
  push:
    branches: [main]
    paths: ["src/**", "libs/**", "docs/**", "pocs/todo-app/src/**", "README.md", ".github/workflows/compiler.yml"]

permissions:
  contents: read

concurrency:
  group: compiler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      # The emitters' tests parse their output with each target's own tools; the C++ emitter formats with
      # clang-format, so its version is pinned to keep emitted bytes identical everywhere.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: "4.0"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: clang-format, pinned
        run: uv tool install clang-format==22.1.8 && clang-format --version
      - name: gate
        run: src/bin/check
