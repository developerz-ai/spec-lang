# The todo-app POC gate. It runs pocs/todo-app/bin/check and nothing else, so green locally is green here.
name: todo-app

on:
  pull_request:
    paths: ["pocs/todo-app/**", "src/**", "libs/**", "docs/idea/25-grammar.md", ".github/workflows/todo-app.yml"]
  push:
    branches: [main]
    paths: ["pocs/todo-app/**", "src/**", "libs/**", "docs/idea/25-grammar.md", ".github/workflows/todo-app.yml"]

permissions:
  contents: read

concurrency:
  group: todo-app-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src
      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: "4.0"
          bundler-cache: false
      - name: clang-format, pinned (the C++ emitter's output depends on its version)
        run: uv tool install clang-format==22.1.8 && clang-format --version
      - name: C++ toolchain (cmake and g++ from the runner image)
        run: cmake --version && g++ --version
      - name: setup
        run: pocs/todo-app/bin/setup
      - name: gate
        run: pocs/todo-app/bin/check
