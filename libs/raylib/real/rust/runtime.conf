# What the Rust printer reads of this runtime. Every other file here is copied into the project of an app that has a
# `foreign c "raylib#..."` declaration, under src/libs/raylib/; mod.rs is the module.

# this module is also `crate::libs::screen`, for a runtime that requires one
provides = screen
# its build script, copied to link/raylib.rs: links the shared library
link = link.rs
