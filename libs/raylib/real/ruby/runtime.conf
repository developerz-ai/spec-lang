# What the Ruby printer reads of this runtime. Every other file here is copied into the project of an app that
# has a `foreign c "raylib#..."` declaration, at the same path.

# required by the app's glue; defines the module below
entry = libs/raylib
module = Libs::Raylib
# Fiddle cannot pass a C struct by value; the ffi gem (libffi) can, so no C shim is needed
gem = ffi 1.17.4
