# What the Rust printer reads of this runtime. Every other file here is copied into the project of an app that has the
# `game` shape, under src/libs/game/; mod.rs is the module, its `main` runs the app.

# the app note and parameter that name the executable: @bin("skyhop")
executable = bin.name
# some library of the app provides `crate::libs::screen`: a window to draw on
requires = screen
