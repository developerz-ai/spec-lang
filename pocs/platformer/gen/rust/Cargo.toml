[package]
name = "skyhop"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[lib]
name = "program"
path = "src/lib.rs"

[[bin]]
name = "skyhop"
path = "src/main.rs"

[[bin]]
name = "checks"
path = "src/bin/checks.rs"

[profile.release]
debug = false

# A printed project stands alone; it never joins an enclosing workspace.
[workspace]
