# Projected by hand from app SkyhopRust (src/apps/rust.slg). Stand-in for spec-lang build output; change the spec, not this file.
[package]
name = "skyhop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Skyhop, the platformer, as one native binary linked to raylib 5.5"
publish = false
build = "build.rs"

[lib]
name = "skyhop"
path = "src/lib.rs"

[[bin]]
name = "skyhop"
path = "src/main.rs"

[dependencies]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
